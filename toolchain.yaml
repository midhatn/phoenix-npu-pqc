# Phoenix NPU PQC toolchain and provenance record.
# Current CI is host-only; these native pins preserve the environment associated
# with retained research evidence and do not authorize a hardware dispatch.
schema_version: 1

project:
  name: phoenix-npu-pqc
  repository: "https://github.com/midhatn/phoenix-npu-pqc"
  license: Apache-2.0
  scope: "FIPS 202/203/204 post-quantum cryptography research"

target:
  vendor: AMD
  soc: "Ryzen 9 7940HS"
  soc_family: "Phoenix / Hawk Point (Ryzen 7040 / 8040 series)"
  npu:
    name: "AMD XDNA1 / 1st Gen Ryzen AI"
    codename: npu1
    tile_array: "5 columns x 4 compute-tile rows"
    engine: "AIE2 (AI Engine 2)"
    simd_width_bits: 512
    tile_local_memory_kb: 64
    tile_local_banks: 4

host:
  os: "Windows 11 Pro"
  os_min_build: "22H2"
  os_verified_build: "25H2 (26200)"
  arch: x86_64
  python:
    required_implementation: "CPython"
    required_version: "3.13"
    required_architecture: "x86_64"
    verified: "3.13.15"

drivers:
  amd_npu_driver:
    verified: "32.0.20102.3930"
    minimum: "32.0.20102.3930"
  npu_firmware:
    verified: "1.5.5.391"

toolchain:
  mlir_aie:
    package: "mlir-aie"
    verified_version: "v1.4.1+13 (commit 3ca0193, 2026-08-14)"
    minimum_release: "v1.4.1"
    minimum_release_url: "https://github.com/Xilinx/mlir-aie/releases/tag/v1.4.1"
    verified_commit: "3ca0193cea9e2c39ec670a65f93e1dd43c969f22"
    source: "git checkout in third_party/mlir-aie"
    wheel_name: "mlir_aie-1.4.1-cp313-cp313-win_amd64.whl"
    wheel_url: "https://github.com/Xilinx/mlir-aie/releases/download/v1.4.1/mlir_aie-1.4.1-cp313-cp313-win_amd64.whl"
    wheel_bytes: 180031689
    wheel_sha256: "a3a0266051cbeb7bd28c0304d02fa361b3c05036c81f0880a0046992a77e7663"
  llvm_aie_peano:
    package: "llvm-aie"
    verified_version: "21.0.0.2026080301+c9c5ecb7"
    upstream_repo: "https://github.com/Xilinx/llvm-aie"
    upstream_commit_short: "c9c5ecb7"
    index_url: "https://github.com/Xilinx/llvm-aie/releases/expanded_assets/nightly"
    target_triple: "aie2-none-unknown-elf"
  xrt:
    package_role: "Native Windows XRT runtime and pyxrt bindings"
    verified_version: "2.21.0 (archive release 2.21.75)"
    archive_release: "2.21.75"
    runtime_version: "2.21.0"
    release_url: "https://github.com/Xilinx/XRT/releases/tag/2.21.75"
    sdk_url: "https://github.com/Xilinx/XRT/releases/download/2.21.75/xrt_windows_sdk.zip"
    sdk_bytes: 70834080
    sdk_sha256: "ccc244c2c423588972ade76142cdc01049477aaa39a35be97e782b97eb7c5295"

verification:
  canonical_physical:
    runner: "py .\\run_all_silicon_tests.py"
    scope: "Only runner whose output may be called silicon validation. Physically compiles and dispatches five ordered fail-closed native gates on AMD Phoenix NPU1."
    ordered_gates: ["DR0", "DR1", "DR2a", "DR2b", "DR2c"]
    expected_backends:
      DR0: "m33-dr0:silicon"
      DR1: "dr1-mldsa44-expanda-rejntt:silicon"
      DR2a: "dr2a-mlkem512-samplentt:silicon"
      DR2b: "dr2b-mlkem512-noise-ntt:silicon"
      DR2c: "dr2c-mlkem512-keygen-row:silicon"
    expected_totals:
      DR0: 24
      DR1: 33
      DR2a: 13
      DR2b: 13
      DR2c: 11
    expected_case_total: 94
    excluded: "DR2d integrated ML-KEM-512 K-PKE.KeyGen is never dispatched by this runner."
    non_dispatching_modes: ["--list", "--preflight-only"]
    claim_boundary: "A full pass is 5 narrow milestone gates / 94 cases on Phoenix NPU. It is not complete ML-KEM or ML-DSA and not 100% algorithm residency."
    acceptance_rule: "No NPU claim is accepted unless canonical native runner output from the target laptop passes."
    optional_evidence: "Use --evidence-dir for timestamped JSON provenance and merged per-gate output outside protected evidence."
  physical_status_2026_08_18:
    fresh_current_source_subsuite: "DR0 24/24 + DR2a 13/13 + DR2b 13/13 + DR2c 11/11 = 61/61 physically verified on the target Phoenix laptop."
    historical_dr1: "External operator-retained historical-log assertion: operator-supplied SHA-256 85B373B1E3B8A1BD883DA6BBDE73F874EE5C331B4AE419E5D161758A64EB4A7E; reported backend dr1-mldsa44-expanda-rejntt:silicon; reported TOTAL 33/33 PASS. Raw log bytes are absent from this repository and not independently reproducible."
    no_current_canonical_claim: "Do not combine the fresh 61/61 and historical DR1 33/33 into a current 94/94 claim. Rerun the complete canonical suite on the target laptop."
  host_preflight:
    runner: "python run_all_pqc_tests.py"
    scope: "Host preflight only: contracts and reference checks. Never loads the MLIR-AIE runtime, compiles an AIE program, or dispatches an NPU."
    boundary: "A pass here can never satisfy or be labelled silicon validation."
  historical_foundation:
    m33e_baseline_tag: "v1.0.0"
    m33e_baseline_commit: "9c592a4c077c73f2ebf910aca0b6575664b0726f"
    native_m33_runner_commit: "e77e7ed2783d88b5451394866d7ddfccd9db4f69"
    dr0_dr1_commit: "7b38973789fafb950a26551bc947f4fcaa91ec25"
    boundary: "Historical M32/M33 results are hybrid native and host/NPU work."
  dr2:
    dr2a_dr2b_dr2c: "Narrow physical-result records retained; not integrated KeyGen."
    dr2d: "Integrated ML-KEM-512 K-PKE.KeyGen physical result: TOTAL 0/25 FAIL, exit 1."
    integrated_dr2: "Blocked pending independently checked physical evidence and explicit closure."

bootstrap:
  script: "install"
  windows_clean_clone: "py .\\install"
  implementation: "install.py (maintained stdlib-only native installer; install delegates to it)"
  legacy_entry_point: "py .\\install.py"
  scope: "Provisions the full native Windows toolchain: pinned XRT Windows SDK, pinned mlir-aie commit, pinned mlir_aie cp313 wheel, official iron_setup ironenv, vendored pyxrt, and Peano/llvm-aie. Optional kyber-py, dilithium-py, and pytest host/reference packages are not installed."
  default_handoff: "On a successful full install, automatically invokes py .\\run_all_silicon_tests.py under third_party/mlir-aie/ironenv."
  non_dispatching_modes: ["--check-only", "--download-only", "--self-test", "--no-tests"]
  hash_locked_artifacts:
    - "XRT Windows SDK zip: exact byte length and SHA-256 (toolchain.xrt)"
    - "mlir_aie cp313 win_amd64 wheel: exact byte length and SHA-256 (toolchain.mlir_aie)"
    - "mlir-aie source tree: exact verified commit (toolchain.mlir_aie.verified_commit)"
  not_hash_locked: "The official utils/iron_setup.py step resolves a transitive Python dependency set from package indexes. That set is NOT fully hash-locked by this repository; a complete independently produced verified wheelhouse would be required for that claim."
  guide: "docs/SETUP_WINDOWS.md"
  iron_windows_guide: "https://xilinx.github.io/mlir-aie/1.4.1/buildHostWinNative/"
  evidence_check: "(cd docs/pqc_dr2_evidence_20260818 && sha256sum -c SHA256SUMS)"

# Phoenix NPU PQC — host-only continuous integration.
# This workflow intentionally does not install native NPU tooling, compile AIE
# programs, or dispatch hardware. Native gates remain retained research evidence.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --upgrade ruff
      - name: Lint maintained host-safe entrypoints
        run: ruff check run_all_pqc_tests.py run_all_silicon_tests.py
      - name: Check Python formatting
        run: ruff format --check run_all_pqc_tests.py run_all_silicon_tests.py

  validate-metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validators
        run: python -m pip install --upgrade cffconvert pyyaml
      - name: Validate citation metadata
        run: cffconvert --validate
      - name: Validate toolchain record
        run: |
          python - <<'PY'
          import yaml

          with open("toolchain.yaml", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          required = {
              "schema_version", "project", "target", "host", "drivers",
              "toolchain", "verification", "bootstrap",
          }
          missing = required - set(data)
          assert not missing, f"toolchain.yaml missing: {sorted(missing)}"
          assert data["project"]["name"] == "phoenix-npu-pqc"
          for name in ("mlir_aie", "llvm_aie_peano", "xrt"):
              assert data["toolchain"][name]["verified_version"]
          print("toolchain.yaml OK")
          PY

  host-safe-pqc-tests:
    name: Host-safe PQC tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install host test dependency
        run: python -m pip install --upgrade numpy
      - name: List host-safe test plan
        run: python run_all_pqc_tests.py --dry-run
      - name: Run host-safe PQC suite
        run: python run_all_pqc_tests.py
      - name: Compile Python without execution
        run: python -m compileall -q phoenix_sdr_dsp tests run_all_pqc_tests.py run_all_silicon_tests.py

  evidence-integrity:
    name: Verify protected DR2 evidence
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Verify SHA-256 manifest
        run: (cd docs/pqc_dr2_evidence_20260818 && sha256sum -c SHA256SUMS)

  markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Link check
        uses: gaurav-nelson/github-action-markdown-link-check@v1
        with:
          use-quiet-mode: "yes"
          config-file: ".github/mlc_config.json"

# Phoenix NPU PQC — host-only continuous integration.
# This workflow intentionally does not install native NPU tooling, compile AIE
# programs, or dispatch hardware. It therefore produces NO silicon evidence.
# Canonical silicon validation is the separate physical run of
# `py .\run_all_silicon_tests.py` on the target AMD Phoenix laptop, and a green
# CI badge must never be presented as an NPU claim.
name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install ruff
        run: python -m pip install ruff==0.16.3
      - name: Lint maintained Python
        run: ruff check . install
      - name: Check Python formatting
        run: |
          ruff format --check \
            install install.py run_all_pqc_tests.py run_all_silicon_tests.py \
            phoenix_sdr_dsp/pqc/dr2d_mlkem512_kpke_keygen_graph.py \
            phoenix_sdr_dsp/pqc/dr2d_mlkem512_kpke_keygen_terminal_probe_graph.py \
            phoenix_sdr_dsp/pqc/dr2d_mlkem512_kpke_keygen_w0_token_tap_graph.py \
            tests/production_dependency_guard.py tests/test_install_bootstrap.py \
            tests/test_canonical_silicon_runner_contract.py \
            tests/test_canonical_silicon_runner_behavior.py \
            tests/test_markdown_math_contract.py \
            tests/test_pqc_dr1_contract.py tests/test_pqc_dr2a_contract.py \
            tests/test_pqc_dr2b_contract.py tests/test_pqc_dr2c_contract.py \
            tests/test_pqc_dr2d_contract.py \
            tests/test_release_materials_contract.py \
            tests/pqc_device_resident/test_dr1_mldsa44_rejntt.py \
            tests/pqc_device_resident/test_dr1_mldsa44_rejntt_silicon.py

  validate-metadata:
    name: Validate metadata
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install validators
        run: python -m pip install cffconvert==2.0.0 PyYAML==6.0.3
      - name: Validate citation metadata
        run: cffconvert --validate
      - name: Validate toolchain record
        run: |
          python - <<'PY'
          import yaml

          with open("toolchain.yaml", encoding="utf-8") as handle:
              data = yaml.safe_load(handle)
          required = {
              "schema_version", "project", "target", "host", "drivers",
              "toolchain", "verification", "bootstrap",
          }
          missing = required - set(data)
          assert not missing, f"toolchain.yaml missing: {sorted(missing)}"
          assert data["project"]["name"] == "phoenix-npu-pqc"
          for name in ("mlir_aie", "llvm_aie_peano"):
              assert data["toolchain"][name]["verified_version"]
          xrt = data["toolchain"]["xrt"]
          for name in (
              "archive_release", "runtime_version", "sdk_url", "sdk_bytes",
              "sdk_sha256", "release_url",
          ):
              assert xrt[name], f"toolchain.xrt missing {name}"
          assert xrt["release_url"].endswith(xrt["archive_release"])
          assert f"/download/{xrt['archive_release']}/" in xrt["sdk_url"]
          canonical = data["verification"]["canonical_physical"]
          assert canonical["ordered_gates"] == ["DR0", "DR1", "DR2a", "DR2b", "DR2c"]
          assert canonical["expected_case_total"] == 94
          assert sum(canonical["expected_totals"].values()) == 94
          assert "run_all_silicon_tests.py" in canonical["runner"]
          status = data["verification"]["physical_status_2026_08_18"]
          assert "61/61" in status["fresh_current_source_subsuite"]
          assert "85B373B1E3B8A1BD883DA6BBDE73F874EE5C331B4AE419E5D161758A64EB4A7E" in status["historical_dr1"]
          assert "94/94" in status["no_current_canonical_claim"]
          assert data["verification"]["host_preflight"]["runner"].endswith(
              "run_all_pqc_tests.py"
          )
          assert "NOT fully hash-locked" in data["bootstrap"]["not_hash_locked"]
          print("toolchain.yaml OK")
          PY

  host-preflight-pqc-tests:
    name: Host preflight PQC tests (not silicon validation)
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      # actions/setup-python v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install host test dependency
        run: python -m pip install numpy==2.5.2
      - name: List host preflight test plan
        run: python run_all_pqc_tests.py --dry-run
      - name: List canonical native gate plan (no compilation, no dispatch)
        run: python run_all_silicon_tests.py --list
      - name: Run host preflight PQC suite
        run: python run_all_pqc_tests.py
      - name: Compile Python without execution
        run: python -m compileall -q phoenix_sdr_dsp tests install install.py run_all_pqc_tests.py run_all_silicon_tests.py

  evidence-integrity:
    name: Verify protected DR2 evidence
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify SHA-256 manifest
        run: (cd docs/pqc_dr2_evidence_20260818 && sha256sum -c SHA256SUMS)

  markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Link check
        # gaurav-nelson/github-action-markdown-link-check v1.0.17
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31
        with:
          use-quiet-mode: "yes"
          config-file: ".github/mlc_config.json"
